services:
  - type: web
    name: lecture-notes-generator
    runtime: python
    buildCommand: apt-get update -qq && apt-get install -y -qq ffmpeg && cd frontend && npm install && npm run build
    startCommand: cd backend && pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
